# The KDE Plasma front end of Pi/Ne-Sy as a Flatpak. It builds what is
# checked out in this repository: QEMU and the engine with MAME's Qt
# debugger (../../build-mame.sh --qt), then the core and the app
# (../CMakeLists.txt). ../README.md says how to build and install it.

app-id: com.stalepixels.pinesy.kde
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# build-mame.sh compiles with clang, which the SDK does not have
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: pinesy-kde

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # MAME's PulseAudio module, and its PipeWire module (-sound pipewire)
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # joysticks and gamepads: MAME's evdev module opens /dev/input/event*
  - --device=input
  # a .pinesy file names its media and ROM folders by path, so MAME must
  # reach those paths, not only the file the file dialog gave
  - --filesystem=home
  # the GDB remote stub listens on a TCP port, which a GDB outside the
  # sandbox can only reach on the host's network
  - --share=network

modules:
  # gdb-pinesy: the GDB that debugs the Next's Z80 through MAME's GDB stub
  # and the Pi through QEMU's. ../../build-gdb.sh builds it from the GDB
  # release below, the same release as vendor/gdb. GMP and MPFR are built
  # here, so the build does not depend on what the SDK carries.
  - name: gmp
    buildsystem: autotools
    # GMP 6.3.0's configure test fails under the SDK compiler's default, C23
    build-options:
      env:
        CC: gcc -std=gnu17
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/info
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
        sha256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898

  - name: mpfr
    buildsystem: autotools
    config-opts:
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/info
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz
        sha256: b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01

  - name: gdb-pinesy
    buildsystem: simple
    build-commands:
      - GMP_PREFIX=/app MPFR_PREFIX=/app ./build-gdb.sh --prefix /app
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/gdb/gdb-18.1.tar.xz
        sha256: cd9fc3fe2b47743840e42c1592d3d87f8302eb18639c0b8b4ba0898002e2348f
        dest: vendor/gdb
      # build-gdb.sh only
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - app
          - gtk
          - kde
          - mame
          - qemu
          - roms
          - sd-images
          - debuggers
          - vendor

  # objcopy-pinesy: the objcopy that makes Z80 ELF symbol files for
  # gdb-pinesy (../../docs/gdb.md). GDB's release tarball has no binutils
  # folder, so it comes from the binutils release nearest to it. Only
  # objcopy is built. ../../build-gdb.sh builds it the same way from
  # vendor/gdb.
  - name: objcopy-pinesy
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/app --target=z80-unknown-elf
        --enable-targets=arm-none-eabi,arm-linux-gnueabihf
        --program-suffix=-pinesy --disable-gas --disable-ld --disable-gold
        --disable-gprof --disable-gprofng --disable-nls --disable-werror
        --with-system-zlib --without-zstd CFLAGS=-O2 CXXFLAGS=-O2
      - make -j"$(nproc)" MAKEINFO=true configure-binutils all-bfd all-libiberty all-libsframe
      - make -C binutils -j"$(nproc)" MAKEINFO=true objcopy
      - install -Dm755 binutils/objcopy /app/bin/objcopy-pinesy
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/binutils/binutils-2.47.tar.xz
        sha256: 154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff

  # QEMU and the engine with MAME's Qt debugger, then the core and the
  # app. The SDK has qmake, not qmake6, so MAME finds Qt through QT_HOME.
  # cmake --install puts the app, libpinesy, the engine, the resources
  # folder and the desktop files in /app (../CMakeLists.txt).
  - name: engine
    buildsystem: simple
    # The makefiles GENie writes for MAME add CFLAGS, CXXFLAGS and LDFLAGS
    # from the environment to their own. The SDK's defaults (-fexceptions,
    # -g, --as-needed and others) are cleared, so the engine builds with
    # the flags it gets outside Flatpak.
    build-options:
      append-path: /usr/lib/sdk/llvm22/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      cflags: ''
      cflags-override: true
      cxxflags: ''
      cxxflags-override: true
      ldflags: ''
      ldflags-override: true
    build-commands:
      # meson applies a subproject's packagefiles overlay only when it
      # fetches the subproject itself, so the manifest applies them
      - cp -r qemu/subprojects/packagefiles/berkeley-softfloat-3/. qemu/subprojects/berkeley-softfloat-3/
      - cp -r qemu/subprojects/packagefiles/berkeley-testfloat-3/. qemu/subprojects/berkeley-testfloat-3/
      - ./build-mame.sh --qt QT_HOME=/usr
      - cmake -S kde -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_INSTALL_PREFIX=/app -DKDE_INSTALL_LIBDIR=lib
        -DPINESY_RESOURCES_FOLDER=/app/share/pinesy-kde/resources
      - cmake --build _build
      - cmake --install _build
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - app
          - gtk
          - debuggers
          - sd-images
          - vendor/gdb
          - mame/.git
          - mame/build
          - mame/build-gtk
          - mame/build-qt
          - mame/libmame_pinesy.so
          - mame/libmame_pinesy_gtk.so
          - mame/libmame_pinesy_qt.so
          - mame/3rdparty/genie/bin
          - mame/3rdparty/genie/build/gmake.linux/obj
          - qemu/.git
          - qemu/roms
          # a native build fetches these; the sources below put them in place
          - qemu/subprojects/dtc
          - qemu/subprojects/keycodemapdb
          - qemu/subprojects/berkeley-softfloat-3
          - qemu/subprojects/berkeley-testfloat-3
      # QEMU's subprojects, at the revisions in qemu/subprojects/*.wrap.
      # Meson cannot fetch them in the build sandbox, so the manifest does.
      - type: git
        url: https://gitlab.com/qemu-project/dtc.git
        commit: b6910bec11614980a21e46fbccc35934b671bd81
        dest: qemu/subprojects/dtc
      - type: git
        url: https://gitlab.com/qemu-project/keycodemapdb.git
        commit: f5772a62ec52591ff6870b7e8ef32482371f22c6
        dest: qemu/subprojects/keycodemapdb
      - type: git
        url: https://gitlab.com/qemu-project/berkeley-softfloat-3.git
        commit: b64af41c3276f97f0e181920400ee056b9c88037
        dest: qemu/subprojects/berkeley-softfloat-3
      - type: git
        url: https://gitlab.com/qemu-project/berkeley-testfloat-3.git
        commit: e7af9751d9f9fd3b47911f51a5cfd08af256a9ab
        dest: qemu/subprojects/berkeley-testfloat-3
